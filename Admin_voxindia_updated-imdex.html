
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VoxIndia Admin</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f3f6;color:#172033;font-family:Arial,sans-serif}
header{background:#111827;color:#fff;text-align:center;padding:22px 12px}
header h1{margin:0;font-size:28px}
header p{margin:8px 0 0}
.wrap{max-width:850px;margin:24px auto;padding:12px}
.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:18px;box-shadow:0 3px 14px #0001}
h2{margin:0 0 18px}
input,textarea,select{width:100%;padding:13px;margin:7px 0 14px;border:1px solid #cbd5e1;border-radius:8px;font-size:16px;background:#fff}
textarea{min-height:140px;resize:vertical}
button{padding:12px 16px;border:0;border-radius:8px;font-size:15px;font-weight:bold;cursor:pointer;margin:4px 3px 4px 0}
.primary{background:#2563eb;color:white}
.dark{background:#111827;color:white}
.danger{background:#dc2626;color:white}
.gray{background:#e5e7eb;color:#111}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row button{flex:1}
.check{display:flex;align-items:center;gap:10px;margin:10px 0}
.check input{width:auto;margin:0}
.muted{font-size:14px;color:#64748b}
.hidden{display:none!important}
.status{margin-top:10px;white-space:pre-wrap;color:#b91c1c}
.newsitem{border:1px solid #e2e8f0;padding:14px;border-radius:10px;margin:12px 0}
.newsitem h3{margin:0 0 8px}
.video{width:100%;aspect-ratio:16/9;border:0;border-radius:9px}
a{color:#2563eb;overflow-wrap:anywhere}
</style>
</head>
<body>
<header>
  <h1>VoxIndia Admin</h1>
  <p>News Management Panel</p>
</header>

<div class="wrap">
  <section class="card" id="loginBox">
    <h2>Admin Login</h2>
    <input id="email" type="email" placeholder="Admin Email">
    <input id="password" type="password" placeholder="Password">
    <div class="row">
      <button class="primary" id="emailLogin">Email Login</button>
      <button class="dark" id="googleLogin">Google Login</button>
    </div>
    <button class="gray" id="forgot">Forgot Password?</button>
    <div class="status" id="loginStatus"></div>
  </section>

  <main id="adminPanel" class="hidden">
    <section class="card">
      <div class="row">
        <h2 style="flex:1">News Editor</h2>
        <button class="danger" id="logout">Logout</button>
      </div>

      <form id="newsForm">
        <label>News Title</label>
        <input id="title" required placeholder="News headline">

        <label>Category</label>
        <select id="category">
          <option>राष्ट्रीय</option>
          <option>मध्य प्रदेश</option>
          <option>दुनिया</option>
          <option>खेल</option>
          <option>मनोरंजन</option>
          <option>व्यापार</option>
          <option>अन्य</option>
        </select>

        <label>News Details</label>
        <textarea id="content" required placeholder="News ki puri jankari likhein"></textarea>

        <label>YouTube Video Link (Optional)</label>
        <input id="youtubeUrl" type="url" placeholder="https://www.youtube.com/watch?v=...">
        <p class="muted">YouTube video ka link yahan paste karein.</p>
        <div id="previewBox" class="hidden"></div>

        <label class="check">
          <input type="checkbox" id="breaking">
          Breaking News
        </label>

        <label class="check">
          <input type="checkbox" id="published" checked>
          Publish News
        </label>

        <button class="primary" id="saveNews" type="submit">Save News</button>
        <button class="gray hidden" id="cancelEdit" type="button">Cancel Edit</button>
        <div class="status" id="formStatus"></div>
      </form>
    </section>

    <section class="card">
      <h2>News List</h2>
      <div id="newsList">Loading news...</div>
    </section>
  </main>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth,signInWithEmailAndPassword,GoogleAuthProvider,
  signInWithPopup,onAuthStateChanged,signOut,sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore,collection,addDoc,getDocs,doc,
  updateDoc,deleteDoc,serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* Latest Firebase Web App config */
const firebaseConfig = {
  apiKey: "AIzaSyBLRtN-Q15B0EeXfe4gyu50YZTGull-kzU",
  authDomain: "voxindia-77b87.firebaseapp.com",
  databaseURL: "https://voxindia-77b87-default-rtdb.firebaseio.com",
  projectId: "voxindia-77b87",
  storageBucket: "voxindia-77b87.firebasestorage.app",
  messagingSenderId: "475424283766",
  appId: "1:475424283766:web:d86af5966be9578f3d9357",
  measurementId: "G-2HZL7BG9FG"
};

const ADMIN_EMAIL = "official.voxindia@gmail.com";
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const googleProvider = new GoogleAuthProvider();
const $ = id => document.getElementById(id);
let editingId = null;

function message(id,text,color="#b91c1c"){
  $(id).textContent=text;
  $(id).style.color=color;
}

function youtubeId(value){
  try{
    const u=new URL(value);
    if(u.hostname==="youtu.be") return u.pathname.slice(1);
    if(u.hostname.includes("youtube.com")){
      if(u.pathname==="/watch") return u.searchParams.get("v");
      if(u.pathname.startsWith("/embed/")) return u.pathname.split("/")[2];
      if(u.pathname.startsWith("/shorts/")) return u.pathname.split("/")[2];
    }
  }catch(e){}
  return null;
}

$("youtubeUrl").addEventListener("input",()=>{
  const id=youtubeId($("youtubeUrl").value.trim());
  if(!id){
    $("previewBox").classList.add("hidden");
    $("previewBox").innerHTML="";
    return;
  }
  $("previewBox").classList.remove("hidden");
  $("previewBox").innerHTML="";
  const frame=document.createElement("iframe");
  frame.className="video";
  frame.src="https://www.youtube.com/embed/"+encodeURIComponent(id);
  frame.allowFullscreen=true;
  frame.setAttribute("allow","accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture");
  $("previewBox").appendChild(frame);
});

/* Email/password login */
$("emailLogin").onclick=async()=>{
  try{
    message("loginStatus","Login ho raha hai...","#2563eb");
    await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value);
  }catch(e){
    message("loginStatus","Firebase: "+e.message);
  }
};

/* Google login */
$("googleLogin").onclick=async()=>{
  try{
    message("loginStatus","Google login ho raha hai...","#2563eb");
    await signInWithPopup(auth,googleProvider);
  }catch(e){
    message("loginStatus","Firebase: "+e.message);
  }
};

/* Password reset */
$("forgot").onclick=async()=>{
  const email=$("email").value.trim();
  if(!email){
    message("loginStatus","Pehle email enter karein.");
    return;
  }
  try{
    await sendPasswordResetEmail(auth,email);
    message("loginStatus","Password reset email bhej diya gaya. Inbox check karein.","#15803d");
  }catch(e){
    message("loginStatus","Firebase: "+e.message);
  }
};

$("logout").onclick=()=>signOut(auth);

/* Admin account check */
onAuthStateChanged(auth,async user=>{
  if(user && user.email?.toLowerCase()===ADMIN_EMAIL){
    $("loginBox").classList.add("hidden");
    $("adminPanel").classList.remove("hidden");
    message("loginStatus","");
    await loadNews();
  }else{
    $("adminPanel").classList.add("hidden");
    $("loginBox").classList.remove("hidden");
    if(user){
      message("loginStatus","Ye account admin nahi hai. Authorized admin account se login karein.");
      await signOut(auth);
    }
  }
});

/* Save / update news */
$("newsForm").addEventListener("submit",async event=>{
  event.preventDefault();
  const user=auth.currentUser;
  if(!user || user.email?.toLowerCase()!==ADMIN_EMAIL){
    message("formStatus","Admin login required.");
    return;
  }

  const video=$("youtubeUrl").value.trim();
  if(video && !youtubeId(video)){
    message("formStatus","Valid YouTube video link paste karein.");
    return;
  }

  const data={
    title:$("title").value.trim(),
    content:$("content").value.trim(),
    category:$("category").value,
    youtubeUrl:video,
    breaking:$("breaking").checked,
    published:$("published").checked,
    updatedAt:serverTimestamp()
  };

  try{
    $("saveNews").disabled=true;
    if(editingId){
      await updateDoc(doc(db,"news",editingId),data);
      message("formStatus","News update ho gayi.","#15803d");
    }else{
      data.createdAt=serverTimestamp();
      await addDoc(collection(db,"news"),data);
      message("formStatus","News save ho gayi.","#15803d");
    }
    resetForm();
    await loadNews();
  }catch(e){
    message("formStatus","Firestore: "+e.message);
  }finally{
    $("saveNews").disabled=false;
  }
});

function resetForm(){
  editingId=null;
  $("newsForm").reset();
  $("published").checked=true;
  $("saveNews").textContent="Save News";
  $("cancelEdit").classList.add("hidden");
  $("previewBox").classList.add("hidden");
  $("previewBox").innerHTML="";
}
$("cancelEdit").onclick=resetForm;

/* Load news */
async function loadNews(){
  $("newsList").textContent="Loading...";
  try{
    const snapshot=await getDocs(collection(db,"news"));
    const items=snapshot.docs.map(d=>({id:d.id,...d.data()}));
    items.sort((a,b)=>(b.createdAt?.toMillis?.()||0)-(a.createdAt?.toMillis?.()||0));

    $("newsList").innerHTML="";
    if(!items.length){
      $("newsList").textContent="Abhi koi news nahi hai.";
      return;
    }

    items.forEach(item=>{
      const box=document.createElement("div");
      box.className="newsitem";

      const heading=document.createElement("h3");
      heading.textContent=item.title||"Untitled";
      const meta=document.createElement("p");
      meta.className="muted";
      meta.textContent=(item.category||"अन्य")+" | "+(item.breaking?"Breaking":"Normal")+" | "+(item.published?"Published":"Draft");
      const body=document.createElement("p");
      body.textContent=(item.content||"").slice(0,220);
      box.append(heading,meta,body);

      if(item.youtubeUrl){
        const link=document.createElement("a");
        link.href=item.youtubeUrl;
        link.target="_blank";
        link.rel="noopener";
        link.textContent="YouTube video open karein";
        box.append(link,document.createElement("br"));
      }

      const edit=document.createElement("button");
      edit.className="primary";
      edit.textContent="Edit";
      edit.onclick=()=>{
        editingId=item.id;
        $("title").value=item.title||"";
        $("content").value=item.content||"";
        $("category").value=item.category||"अन्य";
        $("youtubeUrl").value=item.youtubeUrl||"";
        $("breaking").checked=!!item.breaking;
        $("published").checked=!!item.published;
        $("saveNews").textContent="Update News";
        $("cancelEdit").classList.remove("hidden");
        $("youtubeUrl").dispatchEvent(new Event("input"));
        window.scrollTo({top:0,behavior:"smooth"});
      };

      const del=document.createElement("button");
      del.className="danger";
      del.textContent="Delete";
      del.onclick=async()=>{
        if(!confirm("Kya ye news delete karni hai?")) return;
        try{
          await deleteDoc(doc(db,"news",item.id));
          await loadNews();
        }catch(e){alert("Firestore: "+e.message);}
      };

      box.append(edit,del);
      $("newsList").appendChild(box);
    });
  }catch(e){
    $("newsList").textContent="Firestore error: "+e.message;
  }
}
</script>
</body>
</html>
